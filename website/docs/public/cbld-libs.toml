# Overlay recipes for upstream trees that have no cbld.toml.
# Clone is still the upstream git URL. A cbld.toml in the clone always wins.
#
# cbld ships these recipes built-in and refreshes this official index during
# `cbld doctor`. Set CBLD_LIBS_URL to use a private or forked index instead.
#
# Legacy line format (`shorthand <url>`) is still accepted in ~/.cbld/cbld-libs.

["gh:nlohmann/json"]
git = "https://github.com/nlohmann/json.git"
kind = "header"
include_dirs = ["include"]

["gh:DaveGamble/cJSON"]
git = "https://github.com/DaveGamble/cJSON.git"
kind = "lib"
source_dir = "."
include = ["cJSON.c"]
include_dirs = ["."]
exclude = ["tests/**", "fuzzing/**"]

["gh:fmtlib/fmt"]
git = "https://github.com/fmtlib/fmt.git"
kind = "lib"
include_dirs = ["include"]
include = ["format.cc", "os.cc"]

["gh:CLIUtils/CLI11"]
git = "https://github.com/CLIUtils/CLI11.git"
kind = "header"
include_dirs = ["include"]

["gh:jarro2783/cxxopts"]
git = "https://github.com/jarro2783/cxxopts.git"
kind = "header"
include_dirs = ["include"]

["gh:doctest/doctest"]
git = "https://github.com/doctest/doctest.git"
kind = "header"
include_dirs = ["."]

["gh:Neargye/magic_enum"]
git = "https://github.com/Neargye/magic_enum.git"
kind = "header"
include_dirs = ["include"]

["gh:google/googletest"]
git = "https://github.com/google/googletest.git"
kind = "lib"
source_dir = "."
include_dirs = ["googletest", "googletest/include"]
include = ["googletest/src/gtest-all.cc"]
