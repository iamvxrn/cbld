name: Nightly Cross-Platform CI

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Build & Diagnostic Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install clang + LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Install clang + LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y --no-progress

      - name: Add LLVM to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC developer environment (Windows, for lib.exe)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run Test Suite
        run: cargo test
      - name: Build Binary
        run: cargo build
      - name: Run E2E CLI Diagnostics
        run: |
          cargo run -- doctor --json
          cargo run -- completions zsh
