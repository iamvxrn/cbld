name: CLI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "install.sh"
      - "install.ps1"
      - "uninstall.sh"
      - "uninstall.ps1"
      - "registry/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "install.sh"
      - "install.ps1"
      - "uninstall.sh"
      - "uninstall.ps1"
      - "registry/**"
      - ".github/workflows/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Repo root is the CLI crate; all `run:` steps below use cargo from here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # --- Toolchain: clang / llvm-ar (Linux) -----------------------------
      - name: Install clang + LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          clang --version
          ar --version

      # macOS runners ship Xcode clang + BSD ar; llvm-ar is optional.

      # --- Toolchain: clang / llvm-ar / lib.exe (Windows) -----------------
      - name: Install clang + LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          clang --version
          ar --version

      # --- Toolchain: clang / llvm-ar / lib.exe (Windows) -----------------
      - name: Install clang + LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y --no-progress

      - name: Add LLVM to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # lib.exe/link.exe ship with the MSVC build tools, not LLVM — pull them
      # onto PATH so the archiver fallback chain has a real lib.exe to find.
      - name: Set up MSVC developer environment (Windows, for lib.exe)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify clang/llvm-ar/lib.exe are on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang --version
          llvm-ar --version
          where.exe lib.exe

      # --- Build & unit/integration tests ---------------------------------
      - name: cargo build
        run: cargo build --verbose

      - name: cargo test
        run: cargo test --verbose

      # --- Integration sanity pass: run the real binary -------------------
      - name: cbld doctor (sanity check)
        shell: bash
        run: cargo run --quiet -- doctor

  recipes:
    name: overlay recipes (${{ matrix.set }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: previous
            json: "3.11.3"
            cjson: "1.7.18"
            fmt: "11.2.0"
          - set: current
            json: "3.12.0"
            cjson: "1.7.19"
            fmt: "12.2.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          clang --version

      - name: cargo build
        run: cargo build --verbose

      - name: Build nlohmann/json, cJSON, fmt from upstream
        shell: bash
        env:
          CBLD_HOME: ${{ runner.temp }}/cbld-home-${{ matrix.set }}
        run: |
          set -euo pipefail
          BIN="$(pwd)/target/debug/cbld"
          WORK="${{ runner.temp }}/overlay-probe-${{ matrix.set }}"
          mkdir -p "$WORK/src"
          cat > "$WORK/cbld.toml" <<EOF
          [package]
          name = "overlay_probe"
          version = "0.1.0"

          [profile.cpp]
          standard = "c++17"

          [dependencies]
          "gh:nlohmann/json" = "${{ matrix.json }}"
          "gh:DaveGamble/cJSON" = "${{ matrix.cjson }}"
          "gh:fmtlib/fmt" = "${{ matrix.fmt }}"
          EOF
          cat > "$WORK/src/main.cpp" <<'EOF'
          #include <cJSON.h>
          #include <fmt/core.h>
          #include <nlohmann/json.hpp>

          int main() {
            nlohmann::json j = {{"ok", true}};
            cJSON* c = cJSON_Parse("{\"ok\":true}");
            if (!c) {
              return 1;
            }
            cJSON_Delete(c);
            fmt::print("{}\n", j.dump());
            return 0;
          }
          EOF
          "$BIN" build --manifest-path "$WORK"
          "$WORK/target/debug/overlay_probe"

